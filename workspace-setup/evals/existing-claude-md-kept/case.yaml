schema_version: "1.1"
name: existing-claude-md-kept
expected_outcome: |
  Notices the existing CLAUDE.md and keeps its user-written content. Shows the proposed change as a draft or diff before writing, even though the user said to go ahead, because the user has not seen the draft yet. The existing CLAUDE.md is unchanged at the end of the run unless the user approved a shown draft.
context:
